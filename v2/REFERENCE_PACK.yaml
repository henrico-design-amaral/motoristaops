rights_constraints:
  - A prancha do operador é referência de comparação; não é servida como uma imagem de página.
  - A composição de Henrico permanece identificada como visual de marca, não fotografia documental.
  - Assets de terceiros e fotos de parceiros exigem autorização antes de uso comercial definitivo.
consumer_agents:
  - henrico-master-orchestrator
  - henrico-developer
  - henrico-visual-qa
  - henrico-memory-archivist
validation_criteria:
  - Oito dobras ordenadas, cada uma com 100svh e snap start/always.
  - Hero desktop e mobile mantém Henrico à direita e leitura à esquerda.
  - FAQ e formulário ocupam dobras distintas.
  - Não há overflow horizontal nos viewports verificados.
  - Workflow de deploy limita mutação a public_html/v2 e preserva a homepage.
  - QA visual e técnico é separado do aceite humano.
handoff_target: hostinger-v2-deploy-and-human-acceptance
