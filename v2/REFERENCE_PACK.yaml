reference_pack_id: HOPS-REF-20261114-motoristaops-v2-fidelity
mode: VALIDATION
status: READY
project: motoristaops
artifact_family: landing-page
surface_or_channel: web-v2-preview
objective: >-
  Reproduzir em HTML a prancha executiva aprovada, com uma seção por dobra,
  persona de Henrico na hero e FAQ/formulário em dobras independentes.
context_signature:
  lifecycle_stage: validate
  modality: interactive
  audience: clientes de transporte executivo em São Paulo
  freshness_need: FRESH_REQUIRED
  reference_depth: DEEP
authority_inputs:
  - id: 00_PROJECT_CORE/CREATIVE_PRODUCTION_BRIEF.md
    role: product
  - id: DESIGN.md
    role: visual
  - id: VISUAL_LOCK.md
    role: visual
  - id: source/landing/README.md
    role: technical
  - id: source/landing/public/assets/hero-v4-3.webp
    role: visual
  - id: operator-reference-ff262f4d
    role: visual
protected_decisions:
  - Uma seção por dobra em oito telas; FAQ é a dobra 6 e formulário a dobra 7.
  - A hero usa a composição aprovada de Henrico, não uma persona fictícia.
  - Instrument Sans e tokens V2 continuam canônicos.
  - Avaliações, capacidades e disponibilidade não podem ser inventadas a partir da prancha.
  - A publicação fica isolada em /v2; a homepage da raiz não é alterada.
selected_patterns:
  - pattern_id: pattern:visual-lock
    summary: Preservar identidade, assets e linguagem visual aprovados.
    intended_application: Composição, paleta, assinatura e hero da landing V2.
    constraints: Não criar uma segunda identidade nem substituir assets oficiais por aproximações.
    validation: Render comparado com a prancha e com o Visual Lock do projeto.
  - pattern_id: pattern:interaction-fidelity-gate
    summary: Validar comportamento real, não apenas semelhança estática.
    intended_application: Scroll snap, menu, idiomas, FAQ e validação do formulário.
    constraints: Nenhuma mensagem é enviada durante o QA.
    validation: Interações executadas em navegador e registradas no QA.
  - pattern_id: pattern:role-scoped-rhythm-contract
    summary: Separar ritmos tipográfico, espacial e responsivo por função.
    intended_application: Hierarquia da hero, grids de cinco cartões e dobras editoriais.
    constraints: Não comprimir todas as seções em uma única grade uniforme.
    validation: Cada dobra mantém hierarquia própria sem vazar para a adjacente.
  - pattern_id: pattern:canonical-design-token-authority-preservation-gate
    summary: Manter a autoridade dos tokens canônicos existentes.
    intended_application: Instrument Sans, cores e estados de interação V2.
    constraints: A fonte serifada da prancha é referência visual, não nova autoridade tipográfica.
    validation: Nenhuma nova fonte ou paleta paralela adicionada.
  - pattern_id: pattern:observed-outcome-verification-contract
    summary: Declarar sucesso somente depois de observar o estado final.
    intended_application: QA local, workflow Hostinger e verificação HTTP pós-deploy.
    constraints: Build local não prova publicação.
    validation: Workflow verde, /v2 com a hero nova e homepage original intacta.
negative_patterns:
  - pattern: generic-saas-drift
    scope: project
    reason: A peça deve manter a linguagem executiva/editorial da MotoristaOPS.
  - pattern: poster-compression
    scope: artifact-family
    reason: O operador exige uma seção por dobra, não a prancha inteira comprimida em uma tela.
  - pattern: invented-commercial-proof
    scope: project
    reason: Nomes, estrelas, frota e capacidades da prancha não são evidência factual.
