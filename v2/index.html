<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#151518">
  <title>MotoristaOPS | Mobilidade executiva</title>
  <meta name="description" content="Mobilidade executiva com conforto, discrição e previsibilidade em São Paulo.">
  <style>
    *{box-sizing:border-box}
    html{background:#151518;scroll-behavior:smooth;scrollbar-width:none}
    html::-webkit-scrollbar{display:none}
    body{margin:0;min-width:320px;background:#151518;color:#f3efe4;font-family:Arial,sans-serif}
    .skip{position:fixed;z-index:20;top:-80px;left:12px;padding:10px 14px;background:#f3efe4;color:#151518}
    .skip:focus{top:12px}
    .reference-page{position:relative;width:min(100%,1920px);aspect-ratio:1086/1448;margin:0 auto;overflow:hidden;background:#151518}
    .reference-page>img{display:block;width:100%;height:100%;object-fit:fill}
    .anchor{position:absolute;left:0;width:1px;height:1px;scroll-margin-top:2px}
    .hotspot,.field{position:absolute;z-index:2;border:0;background:transparent;color:transparent;overflow:hidden;text-indent:-9999px;cursor:pointer}
    .hotspot:focus-visible,.field:focus-visible{outline:3px solid #c79c5b;outline-offset:2px;border-radius:8px}
    .field{z-index:3;text-indent:0;opacity:0;cursor:text;color:#151518;font:500 clamp(8px,1vw,13px)/1 Arial,sans-serif;padding:0 1%}
    .field:focus,.field:not(:placeholder-shown){opacity:1;background:#f3efe4;border-radius:8px}
    .form-status{position:absolute;z-index:4;left:70.8%;top:94.1%;width:23.8%;margin:0;color:#151518;font:600 clamp(7px,.8vw,11px)/1.2 Arial,sans-serif;text-align:center}
    @media (max-width:600px){.reference-page{width:100%;min-height:auto}.form-status{display:none}}
  </style>
</head>
<body>
  <a class="skip" href="#servicos">Ir para os serviços</a>
  <main class="reference-page" aria-label="MotoristaOPS — página V2 conforme a referência visual aprovada">
    <img src="assets/motoristaops-v2-reference.png" width="1086" height="1448" alt="Página MotoristaOPS com hero de mobilidade executiva, serviços, frota, processo, avaliações, perguntas frequentes, formulário e rodapé.">

    <span class="anchor" id="inicio" style="top:0"></span>
    <span class="anchor" id="servicos" style="top:23.35%"></span>
    <span class="anchor" id="veiculos" style="top:42.6%"></span>
    <span class="anchor" id="como-funciona" style="top:62.5%"></span>
    <span class="anchor" id="avaliacoes" style="top:72.4%"></span>
    <span class="anchor" id="contato" style="top:83.15%"></span>

    <a class="hotspot" href="#servicos" aria-label="Serviços" style="left:29.7%;top:.65%;width:7.8%;height:3.1%">Serviços</a>
    <a class="hotspot" href="#veiculos" aria-label="Veículos" style="left:38.1%;top:.65%;width:7.1%;height:3.1%">Veículos</a>
    <a class="hotspot" href="#como-funciona" aria-label="Como funciona" style="left:45.6%;top:.65%;width:10.2%;height:3.1%">Como funciona</a>
    <a class="hotspot" href="#avaliacoes" aria-label="Avaliações" style="left:56.1%;top:.65%;width:7.8%;height:3.1%">Avaliações</a>
    <a class="hotspot" href="#contato" aria-label="Contato" style="left:64.1%;top:.65%;width:6.4%;height:3.1%">Contato</a>
    <a class="hotspot" href="#orcamento" aria-label="Solicitar orçamento" style="left:81.2%;top:.45%;width:15.5%;height:2.7%">Solicitar orçamento</a>

    <a class="hotspot" href="#orcamento" aria-label="Solicitar orçamento" style="left:5.2%;top:18.55%;width:18.2%;height:2.8%">Solicitar orçamento</a>
    <a class="hotspot" href="https://wa.me/5511988329725" target="_blank" rel="noopener noreferrer" aria-label="Falar no WhatsApp" style="left:24.5%;top:18.55%;width:15.8%;height:2.8%">Falar no WhatsApp</a>
    <a class="hotspot" href="https://wa.me/5511988329725" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" style="left:93.2%;top:3.65%;width:4.6%;height:3.6%">WhatsApp</a>

    <form id="orcamento" aria-label="Solicitar orçamento pelo WhatsApp">
      <label><span hidden>Nome completo</span><input class="field" name="nome" autocomplete="name" placeholder=" " style="left:71.2%;top:84.72%;width:23.5%;height:1.48%"></label>
      <label><span hidden>E-mail</span><input class="field" name="email" type="email" autocomplete="email" placeholder=" " style="left:71.2%;top:86.35%;width:23.5%;height:1.48%"></label>
      <label><span hidden>Data do serviço</span><input class="field" name="data" inputmode="numeric" placeholder=" " style="left:71.2%;top:87.98%;width:11.8%;height:1.48%"></label>
      <label><span hidden>Horário</span><input class="field" name="horario" inputmode="numeric" placeholder=" " style="left:83.25%;top:87.98%;width:11.45%;height:1.48%"></label>
      <label><span hidden>Origem e destino</span><input class="field" name="rota" placeholder=" " style="left:71.2%;top:89.6%;width:23.5%;height:1.48%"></label>
      <button class="hotspot" type="submit" aria-label="Solicitar orçamento pelo WhatsApp" style="left:71.2%;top:91.52%;width:23.7%;height:2.35%">Solicitar orçamento pelo WhatsApp</button>
      <p class="form-status" id="form-status" aria-live="polite"></p>
    </form>

    <a class="hotspot" href="https://wa.me/5511988329725" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp MotoristaOPS" style="left:63.2%;top:96.25%;width:16.2%;height:2.7%">WhatsApp MotoristaOPS</a>
  </main>
  <script>
    const form=document.querySelector('#orcamento');
    const status=document.querySelector('#form-status');
    form.addEventListener('submit',event=>{
      event.preventDefault();
      const data=new FormData(form);
      const lines=['Olá! Gostaria de solicitar um orçamento MotoristaOPS.','',`Nome: ${data.get('nome')||'-'}`,`E-mail: ${data.get('email')||'-'}`,`Data: ${data.get('data')||'-'}`,`Horário: ${data.get('horario')||'-'}`,`Origem e destino: ${data.get('rota')||'-'}`];
      status.textContent='Abrindo o WhatsApp…';
      window.open(`https://wa.me/5511988329725?text=${encodeURIComponent(lines.join('\n'))}`,'_blank','noopener,noreferrer');
    });
  </script>
</body>
</html>
