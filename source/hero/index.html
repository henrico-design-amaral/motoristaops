<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hero Preview | MotoristaOPS</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#070709">
  <style>
    :root{--night:#070709;--champagne:#C79C5B;--ivory:#F3EFE4}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--night);overflow:hidden}
    body{display:grid;place-items:center}
    .stage{
      position:relative;
      width:min(100vw,calc(100vh * 1.776833));
      height:min(100vh,calc(100vw / 1.776833));
      overflow:hidden;
      background:#070709;
      container-type:inline-size;
    }
    .reference{
      position:absolute;inset:0;
      width:100%;height:100%;object-fit:cover;object-position:center;
      display:block;
    }
    /* Gate 1: neutralize all baked UI from the approved static mock. */
    .mask-header{position:absolute;left:0;right:0;top:0;height:13%;background:linear-gradient(180deg,rgba(7,7,9,.97) 0%,rgba(7,7,9,.92) 64%,rgba(7,7,9,0) 100%)}
    .mask-left{position:absolute;left:0;top:10%;bottom:17%;width:49%;background:linear-gradient(90deg,rgba(7,7,9,.995) 0%,rgba(7,7,9,.985) 62%,rgba(7,7,9,.88) 82%,rgba(7,7,9,0) 100%)}
    .mask-right{position:absolute;right:0;top:11%;width:18%;height:27%;background:linear-gradient(270deg,rgba(7,7,9,.58) 0%,rgba(7,7,9,.34) 48%,rgba(7,7,9,0) 100%)}
    .mask-bottom{position:absolute;left:0;right:0;bottom:0;height:18.5%;background:linear-gradient(180deg,rgba(7,7,9,.30) 0%,rgba(7,7,9,.94) 27%,rgba(7,7,9,.995) 100%);border-top:1px solid rgba(199,156,91,.18)}
    .vignette{position:absolute;inset:0;box-shadow:inset 0 0 10cqw rgba(0,0,0,.34);pointer-events:none}
    .gate{position:absolute;right:1.4%;bottom:1.3%;padding:.45cqw .65cqw;border:1px solid rgba(199,156,91,.34);font:600 .48cqw/1 Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,239,228,.48);background:rgba(7,7,9,.78)}
  </style>
</head>
<body data-build="motoristaops-hero-waterfall-phase-1">
  <main class="stage" aria-label="MotoristaOPS hero — fase 1, fundo">
    <img class="reference" src="./hero-approved-reference.webp" alt="">
    <div class="mask-header" aria-hidden="true"></div>
    <div class="mask-left" aria-hidden="true"></div>
    <div class="mask-right" aria-hidden="true"></div>
    <div class="mask-bottom" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="gate">Fase 1 · fundo</div>
  </main>
</body>
</html>
