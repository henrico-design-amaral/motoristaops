    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--night);overflow:hidden}
    body{display:grid;place-items:center;font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}

    .mask-right{position:absolute;right:0;top:11%;width:18%;height:27%;background:linear-gradient(270deg,rgba(7,7,9,.58) 0%,rgba(7,7,9,.34) 48%,rgba(7,7,9,0) 100%)}

    .vignette{position:absolute;inset:0;box-shadow:inset 0 0 10cqw rgba(0,0,0,.34);pointer-events:none}
    .header{position:absolute;z-index:10;top:0;left:4.15%;right:4.15%;height:12.6%;display:grid;grid-template-columns:24% 1fr 24%;align-items:center}
    .brand{justify-self:start;display:block;width:20.3cqw;line-height:0}.brand img{display:block;width:100%;height:auto}
    .nav{justify-self:center;display:flex;align-items:center;gap:3.25cqw;font-size:1.02cqw;font-weight:450;color:rgba(243,239,228,.86);white-space:nowrap}
    .nav a{position:relative;padding:.95cqw 0}.nav a:first-child::after{content:"";position:absolute;left:0;right:0;bottom:.3cqw;height:.12cqw;background:var(--champagne)}
    .top-cta{justify-self:end;display:inline-flex;align-items:center;gap:.75cqw;padding:.82cqw 1.55cqw;border:1px solid rgba(199,156,91,.88);border-radius:999px;font-size:1.06cqw;font-weight:600;color:var(--champagne);white-space:nowrap;background:rgba(7,7,9,.32)}
    .top-cta svg{width:1.35cqw;height:1.35cqw;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .gate{position:absolute;z-index:20;right:1.4%;bottom:1.3%;padding:.45cqw .65cqw;border:1px solid rgba(199,156,91,.34);font:600 .48cqw/1 'Instrument Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(243,239,228,.48);background:rgba(7,7,9,.78)}
