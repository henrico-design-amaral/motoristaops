name: Publish temp landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/temp.astro'
      - 'src/layouts/**'
      - 'src/styles/**'
      - 'src/components/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages-temp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Static analysis
        run: npm run check

      - name: Build GitHub Pages artifact
        env:
          SITE_URL: https://henrico-design-amaral.github.io/motoristaops
          BASE_PATH: /motoristaops
        run: npm run build

      - name: Verify temp route
        run: test -f dist/temp/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
