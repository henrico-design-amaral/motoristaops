name: Deploy attached MotoristaOPS landing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-attached-landing.yml'

concurrency:
  group: motoristaops-public-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated attached landing artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown --id '1oqFZ2WTT3wDwJvZZI20iDkzEUfNNgt9t' --output index.html
          echo '0aa613068343eefba50d85320302f210ecc1e4ed6c0a56610c8f9144ebd1c6f1  index.html' | sha256sum --check --strict
          grep -qF 'Seu compromisso' index.html
          grep -qF 'Motorista particular' index.html
          grep -qF 'https://wa.me/5511953970704' index.html
          ! grep -q '__bundler' index.html
          ! grep -q '<x-dc' index.html

      - name: Validate public Hostinger secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_PUBLIC_TARGET_DIR; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy public index only
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          cd "$HOSTINGER_PUBLIC_TARGET_DIR"
          put index.html -o index.html
          bye
          LFTP

      - name: Verify production landing and dashboard isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            public_home="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 https://www.motoristaops.com.br/ || true)"
            dashboard_home="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 https://dashboard.motoristaops.com.br/ || true)"
            if grep -qF 'Seu compromisso' <<<"$public_home" \
              && grep -qF 'Motorista particular' <<<"$public_home" \
              && grep -qF 'Plano operacional' <<<"$dashboard_home"; then
              echo "Landing deployed and dashboard preserved on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo 'Production verification failed.'
          exit 1

# v2 validated attached artifact deployment
