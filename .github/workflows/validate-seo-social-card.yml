name: Validate MotoristaOPS landing
on:
  pull_request:
    paths:
      - 'source/landing/**'
      - 'scripts/deploy-landing.sh'
      - '.github/workflows/deploy-landing-hostinger.yml'
      - '.github/workflows/validate-seo-social-card.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/landing/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: source/landing
      - run: bash -n scripts/deploy-landing.sh && bash scripts/validate-foundation.sh
