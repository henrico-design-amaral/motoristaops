name: Locked dependency security remediation for unified command

on:
  push:
    branches: [feat/comando-unificado-financeiro-ops-20261111]
    paths:
      - '.github/workflows/security-autofix-unified.yml'

permissions:
  contents: write

jobs:
  remediate:
    if: "!startsWith(github.event.head_commit.message, 'chore(security):')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comando-unificado-financeiro-ops-20261111
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate lockfile from updated overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remediate audit vulnerabilities within compatible dependency ranges
        run: npm audit fix --ignore-scripts --no-fund
      - name: Verify dependency security
        run: npm run security
      - name: Check source and accounting
        run: |
          npm ci --no-audit --no-fund
          npm run validate:data
          npm run check
          npm run test:unified
          npm run build:domains
          test -f dist-dashboard/comando/index.html
      - name: Commit tested lockfile to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): refresh lockfile after verified dependency fixes"
            git push origin HEAD:refs/heads/feat/comando-unificado-financeiro-ops-20261111
          fi
