name: Deploy MotoristaOPS landing only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/parts/**'
      - 'release/runtime-assets/**'
      - 'release/visual-assets/**'
      - 'release/service-assets/**'
      - '.github/workflows/deploy-landing-hostinger.yml'

concurrency:
  group: motoristaops-public-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble and validate landing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-public
          cat source/parts/*.htmlfrag > deploy-public/index.html

          # Runtime profile/icon assets are versioned as WebP in this release.
          sed -i \
            -e 's#/assets/henrico-profile\.png#/assets/henrico-profile.webp#g' \
            -e 's#/assets/icons-official/\([a-z-]*\)\.png#/assets/icons-official/\1.webp#g' \
            deploy-public/index.html

          # Production content overrides maintained by MotoristaOPS.
          # 1) Canonical WhatsApp contact.
          # 2) Remove the duplicate pre-footer CTA section requested for removal.
          python - <<'PY'
          from pathlib import Path

          p = Path('deploy-public/index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('5511953970704', '5511988329725')

          start_marker = '  <section style="padding:clamp(64px,8vw,124px) 0; background:radial-gradient'
          footer_marker = '  <footer data-comment-anchor="footer"'
          start = s.find(start_marker)
          end = s.find(footer_marker, start if start >= 0 else 0)
          if start < 0 or end < 0:
              raise SystemExit('Expected pre-footer CTA section/footer markers were not found.')
          s = s[:start] + s[end:]

          # Preserve metadata/OG URLs, but restore the exact Claude Design visual assets.
          s = s.replace('src="/landing-v3/hero-motoristaops-v4.webp"', 'src="/assets/hero-claude.avif"')
          s = s.replace('src="/landing-v3/logo-header-v3.svg"', 'src="/assets/logo-claude.avif"')

          p.write_text(s, encoding='utf-8')
          PY

          grep -qF '<title>Motorista Particular em São Paulo | MotoristaOPS</title>' deploy-public/index.html
          grep -qF 'data-build="motoristaops-claude-design-2026-09-05"' deploy-public/index.html
          grep -qF 'Seu compromisso' deploy-public/index.html
          grep -qF 'Motorista particular' deploy-public/index.html
          grep -qF 'rel="canonical" href="https://www.motoristaops.com.br/"' deploy-public/index.html
          grep -qF 'property="og:url" content="https://www.motoristaops.com.br/"' deploy-public/index.html
          grep -qF 'property="og:image" content="https://www.motoristaops.com.br/landing-v3/hero-motoristaops-v4.webp"' deploy-public/index.html
          grep -qF 'name="twitter:card" content="summary_large_image"' deploy-public/index.html
          grep -qF 'application/ld+json' deploy-public/index.html
          grep -qF 'src="/assets/hero-claude.avif"' deploy-public/index.html
          grep -qF 'src="/assets/logo-claude.avif"' deploy-public/index.html
          grep -qF '/assets/henrico-profile.webp' deploy-public/index.html
          grep -qF '/assets/icons-official/whatsapp.webp' deploy-public/index.html
          grep -qF '/assets/service-cards.webp' deploy-public/index.html
          grep -qF 'Transfers com pontualidade, conforto e tranquilidade.' deploy-public/index.html
          grep -qF 'Suporte em compromissos, espera e rotinas frequentes.' deploy-public/index.html
          grep -qF 'https://wa.me/5511988329725?' deploy-public/index.html
          ! grep -qF '5511953970704' deploy-public/index.html
          ! grep -qF 'Próximo trajeto' deploy-public/index.html
          ! grep -qF 'Fale comigo pelo WhatsApp.' deploy-public/index.html
          ! grep -qiF 'noindex' deploy-public/index.html
          ! grep -qF '/temp/' deploy-public/index.html
          ! grep -qF 'blob:' deploy-public/index.html
          ! grep -qF '<x-dc>' deploy-public/index.html
          ! grep -qF '<helmet>' deploy-public/index.html
          ! grep -qE '/assets/(henrico-profile|icons-official/[^" ]+)\.png' deploy-public/index.html
          ! grep -qF 'src="/landing-v3/logo-header-v3.svg"' deploy-public/index.html

          cat > deploy-public/robots.txt <<'ROBOTS'
          User-agent: *
          Allow: /

          Sitemap: https://www.motoristaops.com.br/sitemap.xml
          ROBOTS

          cat > deploy-public/sitemap.xml <<'SITEMAP'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://www.motoristaops.com.br/</loc>
              <lastmod>2026-09-05</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          SITEMAP

          cat > deploy-public/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^motoristaops\.com\.br$ [NC]
          RewriteRule ^ https://www.motoristaops.com.br%{REQUEST_URI} [R=301,L]
          HTACCESS

      - name: Rebuild versioned runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-bundle
          cat release/runtime-assets/chunks/part-*.bin > runtime-bundle/runtime-assets.zip
          echo 'a711c244f0e24ff36f12a28e76a865f62f15c813c974adc9cb843515639af40a  runtime-bundle/runtime-assets.zip' | sha256sum -c -
          unzip -q runtime-bundle/runtime-assets.zip -d runtime-bundle/extracted
          cp -a runtime-bundle/extracted/assets deploy-public/

          test -s deploy-public/assets/henrico-profile.webp
          for icon in checklist whatsapp seguranca motorista airport reuniao agendamento rota pontualidade bagagem; do
            test -s "deploy-public/assets/icons-official/${icon}.webp"
          done

      - name: Rebuild exact Claude visual assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-public/assets
          cat release/visual-assets/hero/part-*.bin > deploy-public/assets/hero-claude.avif
          cat release/visual-assets/logo/part-*.bin > deploy-public/assets/logo-claude.avif

          echo '7d6e679dd73dbeba90b9a02953406335ea77e1b28b9ea56354d92f17dd31477b  deploy-public/assets/hero-claude.avif' | sha256sum -c -
          echo 'a9b0eb5462a08f9bb2004223489833315c3d2df64f3f5091b6ba08387f36a155  deploy-public/assets/logo-claude.avif' | sha256sum -c -
          test -s deploy-public/assets/hero-claude.avif
          test -s deploy-public/assets/logo-claude.avif

      - name: Rebuild approved service-card visuals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-public/assets
          cat release/service-assets/part-*.bin > deploy-public/assets/service-cards.webp
          echo 'b5c520b9eb4b0e628b9544d1fc61fc9836018987fe0ff49d1c7a7aebaafd965b  deploy-public/assets/service-cards.webp' | sha256sum -c -
          test -s deploy-public/assets/service-cards.webp

      - name: Recover metadata-only social assets from protected backup branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-public/landing-v3
          git fetch --no-tags --depth=1 origin backup/pre-reset-2026-09-04
          git show FETCH_HEAD:public/landing-v3/hero-motoristaops-v4.webp > deploy-public/landing-v3/hero-motoristaops-v4.webp
          git show FETCH_HEAD:public/landing-v3/logo-oficial.svg > deploy-public/landing-v3/logo-oficial.svg

          test -s deploy-public/landing-v3/hero-motoristaops-v4.webp
          test -s deploy-public/landing-v3/logo-oficial.svg

      - name: Validate public Hostinger secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_PUBLIC_TARGET_DIR; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy public landing only
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --delete-first --verbose deploy-public "$HOSTINGER_PUBLIC_TARGET_DIR"
          bye
          LFTP

      - name: Verify landing production and dashboard preservation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            cache="$(date +%s)-${attempt}"
            public_home="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://www.motoristaops.com.br/?verify=${cache}" || true)"
            dashboard_home="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://dashboard.motoristaops.com.br/?verify=${cache}" || true)"
            robots="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/robots.txt?verify=${cache}" || true)"
            sitemap="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/sitemap.xml?verify=${cache}" || true)"

            if grep -qF 'data-build="motoristaops-claude-design-2026-09-05"' <<<"$public_home" \
              && grep -qF '<title>Motorista Particular em São Paulo | MotoristaOPS</title>' <<<"$public_home" \
              && grep -qF 'Seu compromisso' <<<"$public_home" \
              && grep -qF 'src="/assets/hero-claude.avif"' <<<"$public_home" \
              && grep -qF 'src="/assets/logo-claude.avif"' <<<"$public_home" \
              && grep -qF '/assets/henrico-profile.webp' <<<"$public_home" \
              && grep -qF '/assets/icons-official/whatsapp.webp' <<<"$public_home" \
              && grep -qF '/assets/service-cards.webp' <<<"$public_home" \
              && grep -qF 'Transfers com pontualidade, conforto e tranquilidade.' <<<"$public_home" \
              && grep -qF 'Suporte em compromissos, espera e rotinas frequentes.' <<<"$public_home" \
              && grep -qF 'https://wa.me/5511988329725?' <<<"$public_home" \
              && ! grep -qF '5511953970704' <<<"$public_home" \
              && ! grep -qF 'Próximo trajeto' <<<"$public_home" \
              && ! grep -qF 'Fale comigo pelo WhatsApp.' <<<"$public_home" \
              && grep -qF 'Sitemap: https://www.motoristaops.com.br/sitemap.xml' <<<"$robots" \
              && grep -qF '<loc>https://www.motoristaops.com.br/</loc>' <<<"$sitemap" \
              && grep -qF 'Plano operacional' <<<"$dashboard_home" \
              && grep -qF 'MotoristaOPS' <<<"$dashboard_home"; then
              for asset in \
                'assets/hero-claude.avif' \
                'assets/logo-claude.avif' \
                'assets/service-cards.webp' \
                'landing-v3/hero-motoristaops-v4.webp' \
                'landing-v3/logo-oficial.svg' \
                'assets/henrico-profile.webp' \
                'assets/icons-official/whatsapp.webp' \
                'assets/icons-official/airport.webp'; do
                code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/${asset}")"
                test "$code" = '200'
              done
              remote_service_hash="$(curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/assets/service-cards.webp?verify=${cache}" | sha256sum | awk '{print $1}')"
              test "$remote_service_hash" = 'b5c520b9eb4b0e628b9544d1fc61fc9836018987fe0ff49d1c7a7aebaafd965b'
              exit 0
            fi
            sleep 10
          done
          echo 'Landing did not converge or dashboard preservation check failed.'
          exit 1
