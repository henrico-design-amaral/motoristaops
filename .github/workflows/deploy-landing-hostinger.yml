name: Deploy MotoristaOPS landing only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/parts/**'
      - 'release/runtime-assets/**'
      - 'release/visual-assets/**'
      - 'release/service-assets/**'
      - '.github/workflows/deploy-landing-hostinger.yml'

concurrency:
  group: motoristaops-public-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout landing source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble and validate landing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-public
          cat source/parts/*.htmlfrag > deploy-public/index.html
          sed -i -e 's#/assets/henrico-profile\.png#/assets/henrico-profile.webp#g' deploy-public/index.html

          python - <<'PY'
          from pathlib import Path
          p = Path('deploy-public/index.html')
          s = p.read_text(encoding='utf-8').replace('5511953970704', '5511988329725')
          start_marker = '  <section style="padding:clamp(64px,8vw,124px) 0; background:radial-gradient'
          footer_marker = '  <footer data-comment-anchor="footer"'
          start = s.find(start_marker)
          end = s.find(footer_marker, start if start >= 0 else 0)
          if start < 0 or end < 0:
              raise SystemExit('Expected pre-footer marker/footer were not found.')
          s = s[:start] + s[end:]
          s = s.replace('src="/landing-v3/hero-motoristaops-v4.webp"', 'src="/assets/hero-claude.avif"')
          s = s.replace('src="/landing-v3/logo-header-v3.svg"', 'src="/assets/logo-claude.avif"')
          p.write_text(s, encoding='utf-8')
          PY

          grep -qF '<title>Motorista Particular em São Paulo | MotoristaOPS</title>' deploy-public/index.html
          grep -qF 'data-icon-system="lucide"' deploy-public/index.html
          grep -qF 'data-brand-system="brand-glyphs"' deploy-public/index.html
          grep -qF 'https://unpkg.com/lucide@0.574.0' deploy-public/index.html
          grep -qF -- '--mo-icon-stroke:1.75' deploy-public/index.html
          grep -qF -- '--mo-icon-size-sm:24px' deploy-public/index.html
          grep -qF -- '--mo-icon-size-md:32px' deploy-public/index.html
          grep -qF -- '--mo-icon-size-lg:42px' deploy-public/index.html
          grep -qF -- '--mo-brand-size-header:28px' deploy-public/index.html
          grep -qF -- '--mo-brand-size-hero:30px' deploy-public/index.html
          grep -qF -- '--mo-brand-size-footer:30px' deploy-public/index.html
          grep -qF 'MotoristaIconSystem' deploy-public/index.html
          grep -qF 'MotoristaBrandSystem' deploy-public/index.html
          for semantic in airport meeting health event travel wait schedule route communication details punctuality discretion care continuity experience commitment posture arrow-right external location; do
            grep -qF "data-mo-icon=\"${semantic}\"" deploy-public/index.html
          done
          for brand in whatsapp instagram google; do
            grep -qF "data-brand-icon=\"${brand}\"" deploy-public/index.html
          done
          grep -qF 'https://www.instagram.com/motoristaops/' deploy-public/index.html
          grep -qF 'Ida, chegada, bagagem e horário planejados com antecedência.' deploy-public/index.html
          grep -qF 'Espera e acompanhamento' deploy-public/index.html
          grep -qF 'O que faz diferença é o básico bem feito, em todas as etapas.' deploy-public/index.html
          ! grep -qF '<img class="card-icon"' deploy-public/index.html
          ! grep -qF '/assets/icons-official/' deploy-public/index.html
          ! grep -qF 'data:image/png;base64,' deploy-public/index.html
          ! grep -qE 'Georgia|Times New Roman|henrico\.driver\.amaral|5511953970704' deploy-public/index.html

          cat > deploy-public/robots.txt <<'ROBOTS'
          User-agent: *
          Allow: /

          Sitemap: https://www.motoristaops.com.br/sitemap.xml
          ROBOTS

          cat > deploy-public/sitemap.xml <<'SITEMAP'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://www.motoristaops.com.br/</loc>
              <lastmod>2026-09-15</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          SITEMAP

          cat > deploy-public/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^motoristaops\.com\.br$ [NC]
          RewriteRule ^ https://www.motoristaops.com.br%{REQUEST_URI} [R=301,L]
          HTACCESS

      - name: Rebuild production assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-bundle deploy-public/assets deploy-public/landing-v3
          cat release/runtime-assets/chunks/part-*.bin > runtime-bundle/runtime-assets.zip
          echo 'a711c244f0e24ff36f12a28e76a865f62f15c813c974adc9cb843515639af40a  runtime-bundle/runtime-assets.zip' | sha256sum -c -
          unzip -q runtime-bundle/runtime-assets.zip -d runtime-bundle/extracted
          cp -a runtime-bundle/extracted/assets deploy-public/

          # Functional icons render through Lucide and external marks through MotoristaBrandSystem.
          # Purge the legacy raster icon directory so old low-fidelity glyphs cannot reappear.
          rm -rf deploy-public/assets/icons-official
          test -s deploy-public/assets/henrico-profile.webp

          cat release/visual-assets/hero/part-*.bin > deploy-public/assets/hero-claude.avif
          cat release/visual-assets/logo/part-*.bin > deploy-public/assets/logo-claude.avif
          cat release/service-assets/part-*.bin > deploy-public/assets/service-cards.webp
          echo '2b5dd109d05d31dc211b11256cf267d2f99b9d85b95addf5637b84a02890057b  deploy-public/assets/hero-claude.avif' | sha256sum -c -
          echo 'a9b0eb5462a08f9bb2004223489833315c3d2df64f3f5091b6ba08387f36a155  deploy-public/assets/logo-claude.avif' | sha256sum -c -
          echo 'b5c520b9eb4b0e628b9544d1fc61fc9836018987fe0ff49d1c7a7aebaafd965b  deploy-public/assets/service-cards.webp' | sha256sum -c -

          git fetch --no-tags --depth=1 origin backup/pre-reset-2026-09-04
          git show FETCH_HEAD:public/landing-v3/logo-oficial.svg > deploy-public/landing-v3/logo-oficial.svg
          test -s deploy-public/landing-v3/logo-oficial.svg

      - name: Install deploy tools and validate secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_PUBLIC_TARGET_DIR; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy public landing only
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --delete-first --verbose deploy-public "$HOSTINGER_PUBLIC_TARGET_DIR"
          bye
          LFTP

      - name: Verify landing production and dashboard preservation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            cache="$(date +%s)-${attempt}"
            public_home="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://www.motoristaops.com.br/?verify=${cache}" || true)"
            dashboard_home="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://dashboard.motoristaops.com.br/?verify=${cache}" || true)"
            if grep -qF 'data-icon-system="lucide"' <<<"$public_home" \
              && grep -qF 'data-brand-system="brand-glyphs"' <<<"$public_home" \
              && grep -qF 'https://unpkg.com/lucide@0.574.0' <<<"$public_home" \
              && grep -qF 'MotoristaIconSystem' <<<"$public_home" \
              && grep -qF 'MotoristaBrandSystem' <<<"$public_home" \
              && grep -qF 'data-mo-icon="airport"' <<<"$public_home" \
              && grep -qF 'data-mo-icon="location"' <<<"$public_home" \
              && grep -qF 'data-brand-icon="whatsapp"' <<<"$public_home" \
              && grep -qF 'data-brand-icon="instagram"' <<<"$public_home" \
              && grep -qF 'data-brand-icon="google"' <<<"$public_home" \
              && ! grep -qF '<img class="card-icon"' <<<"$public_home" \
              && ! grep -qF '/assets/icons-official/' <<<"$public_home" \
              && ! grep -qF 'data:image/png;base64,' <<<"$public_home" \
              && grep -qF 'Plano operacional' <<<"$dashboard_home" \
              && grep -qF 'MotoristaOPS' <<<"$dashboard_home"; then
              for asset in assets/hero-claude.avif assets/logo-claude.avif assets/service-cards.webp assets/henrico-profile.webp landing-v3/logo-oficial.svg; do
                test "$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/${asset}")" = '200'
              done
              echo 'Landing deployment passed with rebuilt social brand glyphs, larger driver metadata icons, canonical Lucide functional icons and preserved dashboard.'
              exit 0
            fi
            sleep 10
          done
          echo 'Landing did not converge or dashboard preservation check failed.'
          exit 1
