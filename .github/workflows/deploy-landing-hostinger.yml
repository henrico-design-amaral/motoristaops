name: Deploy MotoristaOPS landing only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/landing/**'
      - 'scripts/deploy-landing.sh'
      - 'scripts/verify-public-landing*'
      - '.github/workflows/deploy-landing-hostinger.yml'
concurrency:
  group: motoristaops-public-landing
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/landing/package-lock.json
      - name: Foundation gate
        run: bash scripts/validate-foundation.sh
      - name: Install locked dependencies
        working-directory: source/landing
        run: npm ci
      - name: Build indexable production HTML
        working-directory: source/landing
        run: npm run build
      - name: Verify source, assets and WhatsApp rules
        working-directory: source/landing
        run: npm test
      - name: Install deploy client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Replace public landing and remove obsolete landing assets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        run: bash scripts/deploy-landing.sh
      - name: Verify production bytes, SEO and dashboard
        run: bash scripts/verify-public-landing.sh
