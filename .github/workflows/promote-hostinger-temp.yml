name: Promote validated Hostinger temp landing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-hostinger-temp.yml'

concurrency:
  group: motoristaops-public-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Validate public Hostinger secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_PUBLIC_TARGET_DIR; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          python -m pip install --quiet beautifulsoup4 requests

      - name: Download validated temp directory
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promoted
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 25
          cd "$HOSTINGER_PUBLIC_TARGET_DIR"
          lcd "$GITHUB_WORKSPACE"
          mirror --verbose temp promoted
          bye
          LFTP
          test -f promoted/index.html
          grep -qF 'Seu compromisso' promoted/index.html
          grep -qF 'Motorista particular' promoted/index.html
          grep -qF 'Henrico Amaral' promoted/index.html

      - name: Promote preview metadata to production SEO
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json

          ROOT = 'https://www.motoristaops.com.br/'
          TITLE = 'Motorista Particular em São Paulo | MotoristaOPS'
          DESC = ('Motorista particular em São Paulo para aeroportos, reuniões, consultas, '
                  'eventos e viagens, com hora marcada, planejamento, discrição e atendimento direto.')
          OG = ROOT + 'landing-v3/hero-motoristaops-v4.webp'
          DRIVER = ROOT + 'landing-v3/henrico-amaral-v4.webp'

          p = Path('promoted/index.html')
          html = p.read_text(encoding='utf-8')
          html = html.replace('https://www.motoristaops.com.br/temp/', ROOT)
          html = html.replace('https://motoristaops.com.br/temp/', ROOT)
          html = html.replace('/temp/', '/')
          soup = BeautifulSoup(html, 'html.parser')
          if not soup.head:
              raise SystemExit('Missing head')
          head = soup.head

          if soup.title:
              soup.title.string = TITLE
          else:
              tag = soup.new_tag('title'); tag.string = TITLE; head.append(tag)

          def meta(content, name=None, prop=None):
              attrs = {'name': name} if name else {'property': prop}
              for old in list(head.find_all('meta', attrs=attrs)):
                  old.decompose()
              attrs['content'] = content
              head.append(soup.new_tag('meta', attrs=attrs))

          meta(DESC, name='description')
          meta('index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1', name='robots')
          meta('index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1', name='googlebot')
          meta('Henrico Amaral', name='author')

          for old in list(head.find_all('link', rel=lambda x: x and 'canonical' in x)):
              old.decompose()
          head.append(soup.new_tag('link', rel='canonical', href=ROOT))

          meta('website', prop='og:type')
          meta('MotoristaOPS', prop='og:site_name')
          meta('pt_BR', prop='og:locale')
          meta('MotoristaOPS | Motorista Particular em São Paulo', prop='og:title')
          meta(DESC, prop='og:description')
          meta(ROOT, prop='og:url')
          meta(OG, prop='og:image')
          meta(OG, prop='og:image:secure_url')
          meta('image/webp', prop='og:image:type')
          meta('2048', prop='og:image:width')
          meta('868', prop='og:image:height')
          meta('MotoristaOPS — motorista particular em São Paulo', prop='og:image:alt')

          meta('summary_large_image', name='twitter:card')
          meta('MotoristaOPS | Motorista Particular em São Paulo', name='twitter:title')
          meta(DESC, name='twitter:description')
          meta(OG, name='twitter:image')
          meta('MotoristaOPS — motorista particular em São Paulo', name='twitter:image:alt')

          graph = {
            '@context': 'https://schema.org',
            '@graph': [
              {'@type':'WebSite','@id':ROOT+'#website','url':ROOT,'name':'MotoristaOPS','alternateName':'MotoristaOPS por Henrico Amaral','inLanguage':'pt-BR'},
              {'@type':'WebPage','@id':ROOT+'#webpage','url':ROOT,'name':TITLE,'description':DESC,'inLanguage':'pt-BR','isPartOf':{'@id':ROOT+'#website'},'about':{'@id':ROOT+'#service'},'primaryImageOfPage':{'@type':'ImageObject','url':OG}},
              {'@type':'Service','@id':ROOT+'#service','name':'Motorista particular em São Paulo','serviceType':'Motorista particular com hora marcada','url':ROOT,'description':DESC,'areaServed':{'@type':'City','name':'São Paulo'},'provider':{'@id':ROOT+'#henrico-amaral'}},
              {'@type':'Person','@id':ROOT+'#henrico-amaral','name':'Henrico Amaral','url':ROOT+'#quem-dirige','image':DRIVER,'sameAs':['https://instagram.com/henrico.driver.amaral','https://maps.app.goo.gl/aCAXYqSYsQDSt7teA']}
            ]
          }
          for old in list(head.find_all('script', attrs={'type':'application/ld+json'})):
              old.decompose()
          ld = soup.new_tag('script', attrs={'type':'application/ld+json'})
          ld.string = json.dumps(graph, ensure_ascii=False, separators=(',', ':'))
          head.append(ld)
          p.write_text(str(soup), encoding='utf-8')
          PY

          rm -f promoted/.htaccess
          cat > promoted/robots.txt <<'ROBOTS'
          User-agent: *
          Allow: /

          Sitemap: https://www.motoristaops.com.br/sitemap.xml
          ROBOTS
          cat > promoted/sitemap.xml <<'SITEMAP'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://www.motoristaops.com.br/</loc>
              <lastmod>2026-09-05</lastmod>
              <changefreq>weekly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          SITEMAP

      - name: Validate promoted artifact semantically
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json
          html = Path('promoted/index.html').read_text(encoding='utf-8')
          soup = BeautifulSoup(html, 'html.parser')
          assert soup.title and soup.title.get_text(strip=True) == 'Motorista Particular em São Paulo | MotoristaOPS'
          def m(name=None, prop=None):
              tag = soup.find('meta', attrs={'name':name} if name else {'property':prop})
              assert tag, (name, prop)
              return tag.get('content','')
          assert m(name='robots').startswith('index,follow')
          assert 'noindex' not in html.lower()
          canonical = soup.find('link', rel='canonical')
          assert canonical and canonical.get('href') == 'https://www.motoristaops.com.br/'
          assert m(prop='og:url') == 'https://www.motoristaops.com.br/'
          assert m(prop='og:image') == 'https://www.motoristaops.com.br/landing-v3/hero-motoristaops-v4.webp'
          assert m(name='twitter:card') == 'summary_large_image'
          assert soup.find('script', attrs={'type':'application/ld+json'})
          assert 'www.motoristaops.com.br/temp/' not in html
          assert 'Seu compromisso' in html and 'Henrico Amaral' in html
          assert Path('promoted/robots.txt').stat().st_size > 0
          assert Path('promoted/sitemap.xml').stat().st_size > 0
          print('Semantic pre-deploy validation passed.')
          PY

      - name: Promote temp contents to public root only
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 25
          lcd "$GITHUB_WORKSPACE"
          mirror --reverse --verbose promoted "$HOSTINGER_PUBLIC_TARGET_DIR"
          bye
          LFTP

      - name: Verify production and dashboard isolation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          import time, requests
          from bs4 import BeautifulSoup
          ROOT='https://www.motoristaops.com.br/'
          for attempt in range(1,7):
              try:
                  r=requests.get(ROOT, params={'release':'${{ github.sha }}'}, headers={'Cache-Control':'no-cache'}, timeout=30)
                  d=requests.get('https://dashboard.motoristaops.com.br/', headers={'Cache-Control':'no-cache'}, timeout=30)
                  sm=requests.get(ROOT+'sitemap.xml', timeout=30)
                  og=requests.get(ROOT+'landing-v3/hero-motoristaops-v4.webp', timeout=30)
                  r.raise_for_status(); d.raise_for_status(); sm.raise_for_status()
                  soup=BeautifulSoup(r.text,'html.parser')
                  canonical=soup.find('link',rel='canonical')
                  robots=soup.find('meta',attrs={'name':'robots'})
                  ogurl=soup.find('meta',attrs={'property':'og:url'})
                  ok=(soup.title and soup.title.get_text(strip=True)=='Motorista Particular em São Paulo | MotoristaOPS'
                      and canonical and canonical.get('href')==ROOT
                      and robots and robots.get('content','').startswith('index,follow')
                      and ogurl and ogurl.get('content')==ROOT
                      and 'noindex' not in r.text.lower()
                      and 'www.motoristaops.com.br/temp/' not in r.text
                      and 'Seu compromisso' in r.text
                      and ROOT in sm.text
                      and og.status_code==200
                      and 'Plano operacional' in d.text)
                  if ok:
                      print(f'Production promotion verified on attempt {attempt}. Dashboard unchanged.')
                      raise SystemExit(0)
              except Exception as e:
                  print(f'Attempt {attempt}: {e}')
              time.sleep(10)
          raise SystemExit('Production verification failed.')
          PY
