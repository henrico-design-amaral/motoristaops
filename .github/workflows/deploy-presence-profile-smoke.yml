name: Smoke Presence profile deploy on Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presence/runtime/deploy-profile-hostinger.sh'
      - '.github/workflows/deploy-presence-profile-smoke.yml'

concurrency:
  group: motoristaops-presence-profile-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Render deterministic smoke profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/presence-smoke
          node presence/runtime/render-driver.mjs \
            --input presence/runtime/fixtures/driver.sample.json \
            --template presence/templates/landing/driver-standard-v1.html \
            --output /tmp/presence-smoke/index.html \
            --manifest /tmp/presence-smoke/manifest.json \
            --slug presence-smoke \
            --template-key driver-standard \
            --template-version 1
          test -s /tmp/presence-smoke/index.html
          test -s /tmp/presence-smoke/manifest.json

      - name: Install SFTP client and validate secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_PUBLIC_TARGET_DIR; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy smoke profile under temp
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          bash presence/runtime/deploy-profile-hostinger.sh \
            presence-smoke \
            /tmp/presence-smoke/index.html \
            /tmp/presence-smoke/manifest.json \
            "$HOSTINGER_PUBLIC_TARGET_DIR/temp"

      - name: Verify smoke profile and production isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            profile="$(curl -fsSL --connect-timeout 10 --max-time 30 https://www.motoristaops.com.br/temp/presence-smoke/ || true)"
            css="$(curl -fsSL --connect-timeout 10 --max-time 30 https://www.motoristaops.com.br/web/assets/presence.css || true)"
            landing="$(curl -fsSL --connect-timeout 10 --max-time 30 https://www.motoristaops.com.br/ || true)"
            dashboard="$(curl -fsSL --connect-timeout 10 --max-time 30 https://dashboard.motoristaops.com.br/ || true)"

            if grep -qF 'Motorista Demo' <<<"$profile" \
              && grep -qF -- '--mo-champagne:#C79C5B' <<<"$css" \
              && grep -qF 'MotoristaOPS' <<<"$landing" \
              && grep -qF 'Plano operacional' <<<"$dashboard"; then
              echo "Presence profile smoke verified on attempt $attempt."
              exit 0
            fi
            sleep 10
          done
          echo "Presence profile smoke verification failed."
          exit 1

      - name: Remove smoke profile
        if: always()
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set +e
          command -v lftp >/dev/null 2>&1 || exit 0
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 1
          set net:timeout 15
          rm -r "$HOSTINGER_PUBLIC_TARGET_DIR/temp/presence-smoke"
          bye
          LFTP
          exit 0
