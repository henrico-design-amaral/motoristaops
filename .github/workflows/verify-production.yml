name: Verify MotoristaOPS production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/parts/**'
      - 'release/runtime-assets/**'
      - 'release/visual-assets/**'
      - 'release/service-assets/**'
      - '.github/workflows/deploy-landing-hostinger.yml'
      - '.github/workflows/verify-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment convergence
        run: sleep 15

      - name: Verify landing contract and dashboard preservation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            cache="$(date +%s)-${attempt}"
            public_html="$(curl -fsSL --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "https://www.motoristaops.com.br/?verify=${cache}" || true)"
            dashboard_html="$(curl -fsSL --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "https://dashboard.motoristaops.com.br/?verify=${cache}" || true)"
            robots="$(curl -fsSL --connect-timeout 6 --max-time 15 "https://www.motoristaops.com.br/robots.txt?verify=${cache}" || true)"
            sitemap="$(curl -fsSL --connect-timeout 6 --max-time 15 "https://www.motoristaops.com.br/sitemap.xml?verify=${cache}" || true)"
            services_pos="$(grep -bo 'id="servicos"' <<<"$public_html" | head -1 | cut -d: -f1 || true)"
            why_pos="$(grep -bo 'id="por-que-agendar"' <<<"$public_html" | head -1 | cut -d: -f1 || true)"

            if grep -qF 'data-icon-system="lucide"' <<<"$public_html" \
              && grep -qF 'https://unpkg.com/lucide@0.574.0' <<<"$public_html" \
              && grep -qF -- '--mo-icon-stroke:1.75' <<<"$public_html" \
              && grep -qF -- '--mo-icon-size-sm:24px' <<<"$public_html" \
              && grep -qF -- '--mo-icon-size-md:32px' <<<"$public_html" \
              && grep -qF -- '--mo-icon-size-lg:42px' <<<"$public_html" \
              && grep -qF 'MotoristaIconSystem' <<<"$public_html" \
              && grep -qF 'data-mo-icon="airport"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="travel"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="punctuality"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="location"' <<<"$public_html" \
              && grep -qF '<title>Motorista Particular em São Paulo | MotoristaOPS</title>' <<<"$public_html" \
              && grep -qF 'property="og:image" content="https://www.motoristaops.com.br/assets/hero-claude.avif"' <<<"$public_html" \
              && grep -qF 'Pular para o conteúdo' <<<"$public_html" \
              && grep -qF 'Aeroportos e rodoviárias' <<<"$public_html" \
              && grep -qF 'Espera e acompanhamento' <<<"$public_html" \
              && grep -qF 'O valor aparece no jeito de trabalhar.' <<<"$public_html" \
              && grep -qF 'Henrico Amaral.' <<<"$public_html" \
              && grep -qF 'https://www.instagram.com/motoristaops/' <<<"$public_html" \
              && grep -qF '/assets/icons-official/whatsapp.webp' <<<"$public_html" \
              && test -n "$services_pos" && test -n "$why_pos" && test "$services_pos" -lt "$why_pos" \
              && ! grep -qF '<img class="card-icon"' <<<"$public_html" \
              && ! grep -qE '/assets/icons-official/(agendamento|airport|bagagem|checklist|motorista|pontualidade|reuniao|rota|seguranca)' <<<"$public_html" \
              && ! grep -qE 'Georgia|Times New Roman|henrico\.driver\.amaral|5511953970704' <<<"$public_html" \
              && grep -qF 'Sitemap: https://www.motoristaops.com.br/sitemap.xml' <<<"$robots" \
              && grep -qF '<loc>https://www.motoristaops.com.br/</loc>' <<<"$sitemap" \
              && grep -qF '<title>MotoristaOPS · Dashboard</title>' <<<"$dashboard_html" \
              && grep -qF 'Plano operacional' <<<"$dashboard_html" \
              && grep -qF 'Performance' <<<"$dashboard_html" \
              && grep -qF 'Particular' <<<"$dashboard_html"; then
              echo 'MotoristaOPS production verification passed: Lucide is canonical (24/32/42, stroke 1.75), brand marks are separate, and the dashboard is preserved.'
              exit 0
            fi
            sleep 5
          done
          echo 'MotoristaOPS landing verification failed after convergence window.'
          exit 1
