name: Verify MotoristaOPS production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/parts/**'
      - 'release/runtime-assets/**'
      - 'release/visual-assets/**'
      - 'release/service-assets/**'
      - '.github/workflows/deploy-landing-hostinger.yml'
      - '.github/workflows/verify-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for deployment convergence
        run: sleep 15

      - name: Verify landing contract and dashboard preservation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5 6 7 8; do
            cache="$(date +%s)-${attempt}"
            public_html="$(curl -fsSL --retry 1 --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "https://www.motoristaops.com.br/?verify=${cache}" || true)"
            dashboard_html="$(curl -fsSL --retry 1 --connect-timeout 6 --max-time 15 -H 'Cache-Control: no-cache' "https://dashboard.motoristaops.com.br/?verify=${cache}" || true)"
            sitemap="$(curl -fsSL --connect-timeout 6 --max-time 15 "https://www.motoristaops.com.br/sitemap.xml?verify=${cache}" || true)"
            robots="$(curl -fsSL --connect-timeout 6 --max-time 15 "https://www.motoristaops.com.br/robots.txt?verify=${cache}" || true)"
            services_pos="$(grep -bo 'id="servicos"' <<<"$public_html" | head -1 | cut -d: -f1 || true)"
            why_pos="$(grep -bo 'id="por-que-agendar"' <<<"$public_html" | head -1 | cut -d: -f1 || true)"

            if grep -qF 'data-build="motoristaops-claude-design-2026-09-05"' <<<"$public_html" \
              && grep -qF 'data-icon-system="lucide"' <<<"$public_html" \
              && grep -qF 'https://unpkg.com/lucide@1.46.0' <<<"$public_html" \
              && grep -qF -- '--mo-icon-stroke:1.75' <<<"$public_html" \
              && grep -qF -- '--mo-icon-size-sm:24px' <<<"$public_html" \
              && grep -qF -- '--mo-icon-size-md:32px' <<<"$public_html" \
              && grep -qF -- '--mo-icon-size-lg:42px' <<<"$public_html" \
              && grep -qF 'MotoristaIconSystem' <<<"$public_html" \
              && grep -qF 'data-mo-icon="airport"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="meeting"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="health"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="event"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="travel"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="wait"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="punctuality"' <<<"$public_html" \
              && grep -qF 'data-mo-icon="location"' <<<"$public_html" \
              && grep -qF '<title>Motorista Particular em São Paulo | MotoristaOPS</title>' <<<"$public_html" \
              && grep -qF 'rel="canonical" href="https://www.motoristaops.com.br/"' <<<"$public_html" \
              && grep -qF 'property="og:url" content="https://www.motoristaops.com.br/"' <<<"$public_html" \
              && grep -qF 'property="og:image" content="https://www.motoristaops.com.br/assets/hero-claude.avif"' <<<"$public_html" \
              && grep -qF 'Seu compromisso' <<<"$public_html" \
              && grep -qF 'Agendar pelo WhatsApp' <<<"$public_html" \
              && grep -qF 'Pular para o conteúdo' <<<"$public_html" \
              && grep -qF 'Quando faz sentido' <<<"$public_html" \
              && grep -qF 'Para compromissos que pedem mais controle do trajeto.' <<<"$public_html" \
              && grep -qF 'Aeroportos e rodoviárias' <<<"$public_html" \
              && grep -qF 'Ida, chegada, bagagem e horário planejados com antecedência.' <<<"$public_html" \
              && grep -qF 'Consultas e exames' <<<"$public_html" \
              && grep -qF 'Espera e acompanhamento' <<<"$public_html" \
              && grep -qF 'Quando combinado, permaneço disponível dentro da mesma demanda.' <<<"$public_html" \
              && grep -qF 'Por que agendar antes?' <<<"$public_html" \
              && grep -qF 'Porque alguns trajetos não podem depender de improviso.' <<<"$public_html" \
              && grep -qF 'O valor aparece no jeito de trabalhar.' <<<"$public_html" \
              && grep -qF 'O que faz diferença é o básico bem feito, em todas as etapas.' <<<"$public_html" \
              && grep -qF 'Henrico Amaral.' <<<"$public_html" \
              && grep -qF 'Levando pessoas, cuidando de histórias.' <<<"$public_html" \
              && grep -qF 'https://www.instagram.com/motoristaops/' <<<"$public_html" \
              && grep -qF 'src="/assets/hero-claude.avif"' <<<"$public_html" \
              && grep -qF 'src="/assets/logo-claude.avif"' <<<"$public_html" \
              && grep -qF '/assets/henrico-profile.webp' <<<"$public_html" \
              && grep -qF '/assets/icons-official/whatsapp.webp' <<<"$public_html" \
              && grep -qF 'https://wa.me/5511988329725?' <<<"$public_html" \
              && grep -qF '<meta name="theme-color" content="#070709">' <<<"$public_html" \
              && test -n "$services_pos" \
              && test -n "$why_pos" \
              && test "$services_pos" -lt "$why_pos" \
              && ! grep -qF '<img class="card-icon"' <<<"$public_html" \
              && ! grep -qE '/assets/icons-official/(agendamento|airport|bagagem|checklist|motorista|pontualidade|reuniao|rota|seguranca)' <<<"$public_html" \
              && ! grep -qF 'id="como-funciona"' <<<"$public_html" \
              && ! grep -qF 'henrico.driver.amaral' <<<"$public_html" \
              && ! grep -qE 'Georgia|Times New Roman' <<<"$public_html" \
              && ! grep -qF '>IG<' <<<"$public_html" \
              && ! grep -qF '>G<' <<<"$public_html" \
              && ! grep -qF '◎' <<<"$public_html" \
              && ! grep -qF '⌖' <<<"$public_html" \
              && ! grep -qF '5511953970704' <<<"$public_html" \
              && ! grep -qiF 'noindex' <<<"$public_html" \
              && ! grep -qF '/temp/' <<<"$public_html" \
              && ! grep -qF 'blob:' <<<"$public_html" \
              && grep -qF 'Sitemap: https://www.motoristaops.com.br/sitemap.xml' <<<"$robots" \
              && grep -qF '<loc>https://www.motoristaops.com.br/</loc>' <<<"$sitemap" \
              && grep -qF '<title>MotoristaOPS · Dashboard</title>' <<<"$dashboard_html" \
              && grep -qF 'Plano operacional' <<<"$dashboard_html" \
              && grep -qF 'Performance' <<<"$dashboard_html" \
              && grep -qF 'Particular' <<<"$dashboard_html"; then

              for asset in assets/hero-claude.avif assets/logo-claude.avif assets/henrico-profile.webp assets/service-cards.webp assets/icons-official/whatsapp.webp landing-v3/logo-oficial.svg; do
                code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 8 "https://www.motoristaops.com.br/${asset}?verify=${cache}" || true)"
                test "$code" = '200' || { echo "Critical asset failed: ${asset} -> ${code}"; continue 2; }
              done

              echo 'MotoristaOPS landing verification passed: canonical Lucide iconography (24/32/42, stroke 1.75), brand marks, copy, accessibility, assets and dashboard are healthy.'
              exit 0
            fi

            sleep 5
          done

          echo 'MotoristaOPS landing verification failed after convergence window.'
          exit 1
