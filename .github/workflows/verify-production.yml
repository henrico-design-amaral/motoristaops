name: Verify MotoristaOPS production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source/parts/**'
      - 'release/runtime-assets/**'
      - '.github/workflows/deploy-landing-hostinger.yml'
      - '.github/workflows/verify-production.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for landing deploy window
        run: sleep 40

      - name: Verify public landing SEO, assets and dashboard preservation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            cache="$(date +%s)-${attempt}"
            public_html="$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://www.motoristaops.com.br/?verify=${cache}" || true)"
            dashboard_html="$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "https://dashboard.motoristaops.com.br/?verify=${cache}" || true)"
            sitemap="$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/sitemap.xml?verify=${cache}" || true)"
            robots="$(curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/robots.txt?verify=${cache}" || true)"

            if grep -qF 'data-build="motoristaops-claude-design-2026-09-05"' <<<"$public_html" \
              && grep -qF '<title>Motorista Particular em São Paulo | MotoristaOPS</title>' <<<"$public_html" \
              && grep -qF 'name="robots"' <<<"$public_html" \
              && grep -qF 'index,follow,max-image-preview:large' <<<"$public_html" \
              && grep -qF 'rel="canonical" href="https://www.motoristaops.com.br/"' <<<"$public_html" \
              && grep -qF 'property="og:url" content="https://www.motoristaops.com.br/"' <<<"$public_html" \
              && grep -qF 'property="og:image"' <<<"$public_html" \
              && grep -qF 'name="twitter:card" content="summary_large_image"' <<<"$public_html" \
              && grep -qF 'application/ld+json' <<<"$public_html" \
              && grep -qF 'Seu compromisso' <<<"$public_html" \
              && grep -qF 'Henrico Amaral' <<<"$public_html" \
              && grep -qF '/assets/henrico-profile.webp' <<<"$public_html" \
              && grep -qF '/assets/icons-official/whatsapp.webp' <<<"$public_html" \
              && grep -qF 'Sitemap: https://www.motoristaops.com.br/sitemap.xml' <<<"$robots" \
              && grep -qF '<loc>https://www.motoristaops.com.br/</loc>' <<<"$sitemap" \
              && grep -qF 'Plano operacional' <<<"$dashboard_html" \
              && grep -qF 'MotoristaOPS' <<<"$dashboard_html" \
              && ! grep -qiF 'noindex' <<<"$public_html" \
              && ! grep -qF '/temp/' <<<"$public_html" \
              && ! grep -qF 'blob:' <<<"$public_html"; then
                for asset in \
                  'landing-v3/hero-motoristaops-v4.webp' \
                  'landing-v3/logo-header-v3.svg' \
                  'landing-v3/logo-oficial.svg' \
                  'assets/henrico-profile.webp' \
                  'assets/icons-official/airport.webp' \
                  'assets/icons-official/reuniao.webp' \
                  'assets/icons-official/agendamento.webp' \
                  'assets/icons-official/rota.webp' \
                  'assets/icons-official/pontualidade.webp' \
                  'assets/icons-official/bagagem.webp' \
                  'assets/icons-official/checklist.webp' \
                  'assets/icons-official/whatsapp.webp' \
                  'assets/icons-official/seguranca.webp' \
                  'assets/icons-official/motorista.webp'; do
                  code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --connect-timeout 10 --max-time 30 "https://www.motoristaops.com.br/${asset}")"
                  test "$code" = '200'
                done
                echo 'Production verification passed: Claude Design landing, SEO/OG, versioned assets and dashboard are healthy.'
                exit 0
            fi
            sleep 10
          done
          echo 'Production verification failed after convergence window.'
          exit 1
