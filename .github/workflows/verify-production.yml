name: Verify MotoristaOPS production
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy MotoristaOPS landing only']
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-public-landing.sh
