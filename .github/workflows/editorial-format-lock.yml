name: Editorial Format Lock

on:
  pull_request:
    paths:
      - "SOCIAL_EDITORIAL.md"
      - "AGENTS.md"
      - "VISUAL_LOCK.json"
      - "editorial/**"
      - "scripts/validate_social_editorial.py"
      - "scripts/test_validate_social_editorial.py"
      - ".github/workflows/editorial-format-lock.yml"
  push:
    branches: ["main"]
    paths:
      - "SOCIAL_EDITORIAL.md"
      - "AGENTS.md"
      - "VISUAL_LOCK.json"
      - "editorial/**"
      - "scripts/validate_social_editorial.py"
      - "scripts/test_validate_social_editorial.py"
      - ".github/workflows/editorial-format-lock.yml"

jobs:
  editorial-format-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python scripts/test_validate_social_editorial.py
      - name: Validate canonical example manifest
        run: python scripts/validate_social_editorial.py editorial/EDITORIAL_MANIFEST.example.json
