name: Emergency refresh npm lock

on:
  push:
    branches: [dashboard-emergency-2026-10-02]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout emergency branch
        uses: actions/checkout@v4
        with:
          ref: dashboard-emergency-2026-10-02

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: refresh npm lock for patched Astro"
          git push origin HEAD:dashboard-emergency-2026-10-02
