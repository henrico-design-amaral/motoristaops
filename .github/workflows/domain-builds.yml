name: Validate MotoristaOps domain artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data snapshot
        run: npm run validate:data

      - name: Static analysis
        run: npm run check

      - name: Security gate
        run: npm run security

      - name: Build canonical domain artifacts
        env:
          SITE_URL: https://dashboard.motoristaops.com.br
          BASE_PATH: /
        run: npm run build:domains

      - name: Verify public artifact
        run: |
          test -f dist-public/index.html
          test -d dist-public/_astro
          test -f dist-public/.htaccess
          test ! -e dist-public/transito
          test ! -e dist-public/fechamento
          test ! -e dist-public/motorista
          grep -q "Levando pessoas, cuidando de histórias" dist-public/index.html
          grep -q "Motorista particular" dist-public/index.html
          grep -q "motoristaops\\.com\\.br" dist-public/.htaccess
          grep -q "https://www.motoristaops.com.br" dist-public/.htaccess

      - name: Verify dashboard artifact
        run: |
          test -f dist-dashboard/index.html
          test -f dist-dashboard/transito/index.html
          test -f dist-dashboard/previsao/index.html
          test -f dist-dashboard/inteligencia/index.html
          test -f dist-dashboard/contexto/index.html
          test -f dist-dashboard/fechamento/index.html
          test -f dist-dashboard/importar-uber/index.html
          test -f dist-dashboard/copiloto/index.html
          test -f dist-dashboard/fontes-contexto/index.html
          test -f dist-dashboard/data/motoristaops.json
          test ! -e dist-dashboard/motorista
          grep -q "MotoristaOps" dist-dashboard/index.html
          grep -q "Plano operacional" dist-dashboard/index.html

      - name: Upload public artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: motoristaops-public
          path: dist-public
          if-no-files-found: error

      - name: Upload dashboard artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: motoristaops-dashboard
          path: dist-dashboard
          if-no-files-found: error
