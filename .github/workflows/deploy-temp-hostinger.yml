name: Deploy MotoristaOps temp landing to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-temp-hostinger.yml'

concurrency:
  group: motoristaops-temp-landing-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:data && npm run check && npm run security
      - name: Build public artifact
        env:
          SITE_URL: https://dashboard.motoristaops.com.br
          BASE_PATH: /
        run: npm run build:domains
      - name: Verify /temp
        run: test -f dist-public/temp/index.html
      - name: Check Hostinger credentials
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        run: test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USERNAME" && test -n "$HOSTINGER_PASSWORD" && test -n "$HOSTINGER_PORT" && test -n "$HOSTINGER_PUBLIC_TARGET_DIR"
      - run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Deploy public site
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        run: |
          lftp -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" sftp://"$HOSTINGER_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose ./dist-public "$HOSTINGER_PUBLIC_TARGET_DIR"
          bye
          EOF
      - name: Validate live route
        run: |
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -s -o /tmp/temp.html -w '%{http_code}' --max-time 20 https://www.motoristaops.com.br/temp/ || true)"
            if [ "$code" = "200" ] && grep -qi "MotoristaOps" /tmp/temp.html; then
              echo "LIVE"
              exit 0
            fi
            sleep 10
          done
          exit 1
