name: Deploy MotoristaOps temp landing to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-temp-hostinger.yml'

concurrency:
  group: motoristaops-temp-landing-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-temp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate data snapshot
        run: npm run validate:data

      - name: Static analysis
        run: npm run check

      - name: Security gate
        run: npm run security

      - name: Build canonical domain artifacts
        env:
          SITE_URL: https://dashboard.motoristaops.com.br
          BASE_PATH: /
        run: npm run build:domains

      - name: Verify temp artifact
        run: |
          test -f dist-public/temp/index.html
          grep -q "SEU TRAJETO COME" dist-public/temp/index.html
          grep -q "PRIVACIDADE" dist-public/temp/index.html

      - name: Ensure Hostinger public secrets are configured
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        run: |
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USERNAME"
          test -n "$HOSTINGER_PASSWORD"
          test -n "$HOSTINGER_PORT"
          test -n "$HOSTINGER_PUBLIC_TARGET_DIR"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy public landing only
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        run: |
          lftp -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" sftp://"$HOSTINGER_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose ./dist-public "$HOSTINGER_PUBLIC_TARGET_DIR"
          bye
          EOF

      - name: Smoke test temp landing
        run: |
          for attempt in 1 2 3 4 5 6; do
            page="$(curl --fail --silent --show-error --location --max-time 20 https://www.motoristaops.com.br/temp/ || true)"
            if printf '%s' "$page" | grep -q "SEU TRAJETO COME" && printf '%s' "$page" | grep -q "PRIVACIDADE"; then
              echo "Temp landing is live on attempt $attempt."
              exit 0
            fi
            echo "Temp landing not ready on attempt $attempt."
            sleep 10
          done
          echo "Temp landing smoke test failed."
          exit 1
