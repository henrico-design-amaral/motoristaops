name: Validate MotoristaOPS Presence

# Presence CI validates canonical contracts, PostgreSQL invariants and rollback gates.

on:
  pull_request:
    paths:
      - 'presence/**'
      - '.github/workflows/validate-presence.yml'
  push:
    branches: [main]
    paths:
      - 'presence/**'
      - '.github/workflows/validate-presence.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('presence/contracts').glob('*.json'))
          if not files:
              raise SystemExit('No Presence contracts found')

          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY

      - name: Verify deterministic driver renderer
        shell: bash
        run: |
          set -euo pipefail
          node presence/runtime/render-driver.mjs \
            --input presence/runtime/fixtures/driver.sample.json \
            --template presence/templates/landing/driver-standard-v1.html \
            --output /tmp/driver-demo.html

          test -s /tmp/driver-demo.html
          ! grep -q '{{' /tmp/driver-demo.html
          grep -q 'Motorista Demo' /tmp/driver-demo.html
          grep -q 'Traslados agendados.' /tmp/driver-demo.html
          ! grep -q '>LinkedIn<' /tmp/driver-demo.html

      - name: Verify publication manifest is bound to rendered artifact
        shell: bash
        run: |
          set -euo pipefail
          node presence/runtime/render-driver.mjs \
            --input presence/runtime/fixtures/driver.sample.json \
            --template presence/templates/landing/driver-standard-v1.html \
            --output /tmp/driver-published.html \
            --manifest /tmp/driver-published.manifest.json \
            --slug motorista-demo \
            --template-key driver-standard \
            --template-version 1

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';

          const html = fs.readFileSync('/tmp/driver-published.html', 'utf8');
          const manifest = JSON.parse(fs.readFileSync('/tmp/driver-published.manifest.json', 'utf8'));
          const sha256 = createHash('sha256').update(html, 'utf8').digest('hex');

          if (manifest.slug !== 'motorista-demo') throw new Error('Manifest slug mismatch');
          if (manifest.templateKey !== 'driver-standard') throw new Error('Manifest template mismatch');
          if (manifest.templateVersion !== 1) throw new Error('Manifest template version mismatch');
          if (manifest.sha256 !== sha256) throw new Error('Manifest hash does not match rendered HTML');
          if (manifest.bytes !== Buffer.byteLength(html, 'utf8')) throw new Error('Manifest byte count mismatch');

          console.log('Publication manifest bound to rendered artifact OK');
          NODE

      - name: Verify onboarding normalization
        shell: bash
        run: |
          set -euo pipefail
          node presence/runtime/normalize-onboarding.mjs \
            --input presence/runtime/fixtures/onboarding.raw.sample.json \
            --output /tmp/onboarding.normalized.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/onboarding.normalized.json').read_text(encoding='utf-8'))

          assert payload['slug'] == 'motorista-demo'
          assert payload['profile']['displayName'] == 'Motorista Demo'
          assert payload['vehicle']['year'] == 2026
          assert payload['vehicle']['capacity'] == 4
          assert payload['services'] == ['airport', 'executive']
          assert payload['serviceAreas'] == [
              'São Paulo capital',
              'Aeroporto de Guarulhos',
              'Congonhas',
          ]
          assert payload['printPersonalization']['displayName'] == 'Motorista Demo'
          assert payload['shippingAddress']['state'] == 'SP'
          assert payload['socialLinks']['linkedin'] is None
          print('Onboarding normalization OK')
          PY

      - name: Verify Mercado Pago Orders adapter
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            buildMercadoPagoCheckoutProOrder,
            mapMercadoPagoOrderStatus,
            paymentAuthorizesOrderProgress,
            normalizeMercadoPagoOrderWebhook
          } from './presence/runtime/payment-mercado-pago.mjs';

          const fixture = JSON.parse(fs.readFileSync(
            'presence/runtime/fixtures/payment.mercado-pago.sample.json',
            'utf8'
          ));

          const request = buildMercadoPagoCheckoutProOrder(fixture.createOrder);
          if (request.endpoint !== 'https://api.mercadopago.com/v1/orders') throw new Error('Unexpected endpoint');
          if (request.body.processing_mode !== 'manual') throw new Error('Unexpected processing mode');
          if (request.body.total_amount !== '1299.00') throw new Error('Amount formatting failed');
          if (request.body.external_reference !== 'order_123') throw new Error('External reference failed');
          if (request.headers['X-Idempotency-Key'] !== fixture.createOrder.idempotencyKey) throw new Error('Idempotency failed');

          for (const [status, detail, expected, authorizes] of fixture.statuses) {
            const actual = mapMercadoPagoOrderStatus(status, detail);
            if (actual !== expected) throw new Error(`Status map failed: ${status}/${detail} -> ${actual}`);
            if (paymentAuthorizesOrderProgress(actual) !== authorizes) {
              throw new Error(`Authorization decision failed: ${actual}`);
            }
          }

          const webhook = normalizeMercadoPagoOrderWebhook(fixture.webhook);
          if (webhook.externalOrderId !== 'ORDTEST123') throw new Error('Webhook order id failed');
          if (webhook.externalEventId !== 'evt_123') throw new Error('Webhook event id failed');
          if (webhook.signature.dataId !== 'ORDTEST123') throw new Error('Webhook signature input failed');

          console.log('Mercado Pago adapter OK');
          NODE

      - name: Verify Melhor Envio webhook adapter
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHmac } from 'node:crypto';
          import {
            verifyMelhorEnvioSignature,
            mapMelhorEnvioEvent,
            shipmentStatusToOrderState,
            normalizeMelhorEnvioWebhook
          } from './presence/runtime/shipping-melhor-envio.mjs';

          const fixture = JSON.parse(fs.readFileSync(
            'presence/runtime/fixtures/shipping.melhor-envio.sample.json',
            'utf8'
          ));
          const rawBody = JSON.stringify(fixture.payload);
          const signature = createHmac('sha256', fixture.secret).update(rawBody).digest('base64');

          if (!verifyMelhorEnvioSignature(rawBody, signature, fixture.secret)) {
            throw new Error('Valid signature rejected');
          }
          if (verifyMelhorEnvioSignature(rawBody, signature, 'wrong-secret')) {
            throw new Error('Invalid signature accepted');
          }

          for (const [event, expectedShipment, expectedOrder] of fixture.events) {
            const shipment = mapMelhorEnvioEvent(event);
            if (shipment !== expectedShipment) throw new Error(`Shipment map failed: ${event}`);
            const order = shipmentStatusToOrderState(shipment);
            if (order !== expectedOrder) throw new Error(`Order map failed: ${event}`);
          }

          const normalized = normalizeMelhorEnvioWebhook({ rawBody, signature });
          if (normalized.externalOrderId !== fixture.payload.data.id) throw new Error('Order ID mismatch');
          if (normalized.shipmentStatus !== 'POSTED') throw new Error('Posted event normalization failed');
          if (normalized.orderState !== 'POSTED') throw new Error('Order state normalization failed');
          if (normalized.trackingCode !== 'BR123456789XX') throw new Error('Tracking normalization failed');

          console.log('Melhor Envio adapter OK');
          NODE


      - name: Verify deterministic delivery window
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { calculateDeliveryWindow } from './presence/runtime/delivery-estimate.mjs';

          const fixture = JSON.parse(fs.readFileSync(
            'presence/runtime/fixtures/delivery-estimate.sample.json',
            'utf8'
          ));

          const actual = calculateDeliveryWindow(fixture.input);
          for (const [key, expected] of Object.entries(fixture.expected)) {
            if (actual[key] !== expected) {
              throw new Error(`${key}: expected ${expected}, got ${actual[key]}`);
            }
          }
          console.log('Delivery estimate OK');
          NODE



      - name: Verify Google progressive consent config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            GOOGLE_BUSINESS_SCOPE,
            buildGoogleLoginOptions,
            buildGoogleBusinessConsentOptions,
            validateGoogleProviderTokens
          } from './presence/runtime/google-auth.mjs';

          const fixture = JSON.parse(fs.readFileSync(
            'presence/runtime/fixtures/google-auth.sample.json',
            'utf8'
          ));

          const login = buildGoogleLoginOptions(fixture.loginRedirect);
          if (login.provider !== 'google') throw new Error('Provider mismatch');
          if (login.options.scopes) throw new Error('Basic login must not request business scope');

          const business = buildGoogleBusinessConsentOptions(fixture.businessRedirect);
          if (business.options.scopes !== GOOGLE_BUSINESS_SCOPE) throw new Error('Business scope missing');
          if (business.options.queryParams.access_type !== 'offline') throw new Error('Offline access missing');
          if (business.options.queryParams.prompt !== 'consent') throw new Error('Consent prompt missing');

          const withRefresh = validateGoogleProviderTokens(fixture.sessionWithRefresh);
          if (!withRefresh.canRefreshWithoutUser) throw new Error('Refresh token not detected');

          const withoutRefresh = validateGoogleProviderTokens(fixture.sessionWithoutRefresh);
          if (withoutRefresh.canRefreshWithoutUser) throw new Error('Unexpected refresh capability');

          console.log('Google progressive consent config OK');
          NODE


  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motoristaops_presence_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: motoristaops_presence_ci
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Create Supabase-compatible auth stubs
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;

          create schema auth;

          create table auth.users (
            id uuid primary key,
            email text
          );

          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;

          grant usage on schema auth to anon, authenticated, service_role;
          grant execute on function auth.uid() to anon, authenticated, service_role;
          SQL

      - name: Apply canonical Presence schema
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f presence/database/schema.sql

      - name: Verify RLS on exposed Presence tables
        shell: bash
        run: |
          set -euo pipefail
          missing="$(
            psql -At <<'SQL'
          select c.relname
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'public'
            and c.relkind = 'r'
            and c.relname in (
              'profiles','driver_pages','vehicles','driver_services','driver_service_areas',
              'shipping_addresses','social_links','google_business_connections','products','product_inclusions','orders',
              'order_personalizations','order_events','payment_attempts','print_jobs','shipments','shipment_events'
            )
            and not c.relrowsecurity
          order by c.relname;
          SQL
          )"
          test -z "$missing" || {
            echo "Tables without RLS:"
            echo "$missing"
            exit 1
          }

      - name: Verify deterministic order transition gate
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, email)
          values ('11111111-1111-4111-8111-111111111111', 'ci@example.com');

          -- D-011: the first customer must be able to create an order before onboarding/profile.
          insert into public.orders (id, user_id)
          values (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111'
          );

          insert into public.profiles (user_id, display_name, whatsapp)
          values ('11111111-1111-4111-8111-111111111111', 'CI Driver', '5511000000000');

          update public.orders
          set state = 'PRODUCT_SELECTED'
          where id = '22222222-2222-4222-8222-222222222222';
          SQL

          if psql -v ON_ERROR_STOP=1 -c "update public.orders set state = 'PAID' where id = '22222222-2222-4222-8222-222222222222';"; then
            echo "Invalid transition unexpectedly succeeded"
            exit 1
          else
            echo "Invalid transition correctly blocked"
          fi

      - name: Verify order ownership requires auth user, not profile
        shell: bash
        run: |
          set -euo pipefail

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.orders (id, user_id)
          values (
            '77777777-7777-4777-8777-777777777777',
            '99999999-9999-4999-8999-999999999999'
          );
          SQL
          then
            echo "Order for nonexistent auth user unexpectedly succeeded"
            exit 1
          else
            echo "Order ownership FK correctly blocks nonexistent auth user"
          fi

      - name: Verify profile RLS isolation
        shell: bash
        run: |
          set -euo pipefail
          result="$(
            psql -qAt <<'SQL'
          insert into auth.users (id, email)
          values ('33333333-3333-4333-8333-333333333333', 'other@example.com');

          insert into public.profiles (user_id, display_name, whatsapp)
          values ('33333333-3333-4333-8333-333333333333', 'Other Driver', '5511999999999');

          set role authenticated;
          set request.jwt.claim.sub = '11111111-1111-4111-8111-111111111111';

          select count(*) from public.profiles;

          reset role;
          SQL
          )"
          test "$result" = "1" || {
            echo "RLS isolation failed: expected 1 row, got $result"
            exit 1
          }

      - name: Verify atomic onboarding persistence and rollback
        shell: bash
        run: |
          set -euo pipefail

          node presence/runtime/normalize-onboarding.mjs \
            --input presence/runtime/fixtures/onboarding.raw.sample.json \
            --output /tmp/onboarding.normalized.json

          payload="$(jq -c . /tmp/onboarding.normalized.json)"

          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, email)
          values
            ('88888888-8888-4888-8888-888888888888', 'onboarding-ok@example.com'),
            ('99999999-9999-4999-8999-999999999998', 'onboarding-rollback@example.com');

          insert into public.orders (id, user_id)
          values
            ('88888888-8888-4888-8888-888888888880', '88888888-8888-4888-8888-888888888888'),
            ('99999999-9999-4999-8999-999999999980', '99999999-9999-4999-8999-999999999998');

          update public.orders set state='PRODUCT_SELECTED'
          where id in ('88888888-8888-4888-8888-888888888880','99999999-9999-4999-8999-999999999980');
          update public.orders set state='PAYMENT_PENDING'
          where id in ('88888888-8888-4888-8888-888888888880','99999999-9999-4999-8999-999999999980');
          update public.orders set state='PAID'
          where id in ('88888888-8888-4888-8888-888888888880','99999999-9999-4999-8999-999999999980');
          update public.orders set state='ONBOARDING'
          where id in ('88888888-8888-4888-8888-888888888880','99999999-9999-4999-8999-999999999980');
          SQL

          psql -v ON_ERROR_STOP=1 -v payload="$payload" <<'SQL'
          set role service_role;
          select public.persist_presence_onboarding(
            '88888888-8888-4888-8888-888888888880',
            :'payload'::jsonb
          );
          reset role;
          SQL

          test "$(psql -qAt -c "select state from public.orders where id='88888888-8888-4888-8888-888888888880'")" = "DATA_VALID"
          test "$(psql -qAt -c "select count(*) from public.driver_pages where user_id='88888888-8888-4888-8888-888888888888' and slug='motorista-demo'")" = "1"
          test "$(psql -qAt -c "select count(*) from public.order_personalizations where order_id='88888888-8888-4888-8888-888888888880'")" = "1"
          test "$(psql -qAt -c "select count(*) from public.order_events where order_id='88888888-8888-4888-8888-888888888880' and state='DATA_VALID'")" = "1"

          invalid_payload="$(jq -c '.socialLinks.instagram="http://invalid.example"' /tmp/onboarding.normalized.json)"
          if psql -v ON_ERROR_STOP=1 -v payload="$invalid_payload" <<'SQL'
          set role service_role;
          select public.persist_presence_onboarding(
            '99999999-9999-4999-8999-999999999980',
            :'payload'::jsonb
          );
          SQL
          then
            echo "Invalid onboarding unexpectedly committed"
            exit 1
          else
            echo "Invalid onboarding correctly rolled back"
          fi

          test "$(psql -qAt -c "select state from public.orders where id='99999999-9999-4999-8999-999999999980'")" = "ONBOARDING"
          test "$(psql -qAt -c "select count(*) from public.profiles where user_id='99999999-9999-4999-8999-999999999998'")" = "0"
          test "$(psql -qAt -c "select count(*) from public.driver_pages where user_id='99999999-9999-4999-8999-999999999998'")" = "0"
          test "$(psql -qAt -c "select count(*) from public.order_personalizations where order_id='99999999-9999-4999-8999-999999999980'")" = "0"
          test "$(psql -qAt -c "select count(*) from public.shipping_addresses where user_id='99999999-9999-4999-8999-999999999998'")" = "0"

          if psql -v ON_ERROR_STOP=1 -v payload="$payload" <<'SQL'
          set role authenticated;
          set request.jwt.claim.sub = '99999999-9999-4999-8999-999999999998';
          select public.persist_presence_onboarding(
            '99999999-9999-4999-8999-999999999980',
            :'payload'::jsonb
          );
          SQL
          then
            echo "Authenticated client unexpectedly executed onboarding persistence"
            exit 1
          else
            echo "Direct authenticated RPC correctly blocked"
          fi

      - name: Verify public snapshot privacy and renderer handoff
        shell: bash
        run: |
          set -euo pipefail

          psql -qAt -v ON_ERROR_STOP=1 <<'SQL' > /tmp/presence-preview.json
          set role service_role;
          select public.prepare_presence_preview(
            '88888888-8888-4888-8888-888888888880'
          )::text;
          SQL

          jq -e '.slug == "motorista-demo"' /tmp/presence-preview.json >/dev/null
          jq -e '.templateKey == "driver-standard"' /tmp/presence-preview.json >/dev/null
          jq -e '.templateVersion == 1' /tmp/presence-preview.json >/dev/null
          jq -e '.renderData.driver.display_name == "Motorista Demo"' /tmp/presence-preview.json >/dev/null
          jq -e 'has("shippingAddress") | not' /tmp/presence-preview.json >/dev/null
          jq -e 'has("printPersonalization") | not' /tmp/presence-preview.json >/dev/null
          jq -e '.renderData.driver | has("phone") | not' /tmp/presence-preview.json >/dev/null
          jq -e '.renderData.driver | has("full_name") | not' /tmp/presence-preview.json >/dev/null
          ! grep -qF 'Rua de Demonstração' /tmp/presence-preview.json
          ! grep -qF '00000-000' /tmp/presence-preview.json
          ! grep -qF 'Aeroportos · Executivo' /tmp/presence-preview.json

          jq '.renderData' /tmp/presence-preview.json > /tmp/presence-render-data.json
          slug="$(jq -r '.slug' /tmp/presence-preview.json)"
          template_key="$(jq -r '.templateKey' /tmp/presence-preview.json)"
          template_version="$(jq -r '.templateVersion' /tmp/presence-preview.json)"

          node presence/runtime/render-driver.mjs \
            --input /tmp/presence-render-data.json \
            --template presence/templates/landing/driver-standard-v1.html \
            --output /tmp/presence-preview.html \
            --manifest /tmp/presence-preview.manifest.json \
            --slug "$slug" \
            --template-key "$template_key" \
            --template-version "$template_version"

          test -s /tmp/presence-preview.html
          test -s /tmp/presence-preview.manifest.json
          grep -qF 'Motorista Demo' /tmp/presence-preview.html
          ! grep -qF 'Rua de Demonstração' /tmp/presence-preview.html

          psql -qAt -v ON_ERROR_STOP=1 <<'SQL' > /tmp/presence-confirmed.json
          set role service_role;
          select public.confirm_presence_preview(
            '88888888-8888-4888-8888-888888888880'
          )::text;
          SQL

          test "$(psql -qAt -c "select state from public.orders where id='88888888-8888-4888-8888-888888888880'")" = "CUSTOMER_CONFIRMED"
          test "$(psql -qAt -c "select count(*) from internal.order_snapshots where order_id='88888888-8888-4888-8888-888888888880' and snapshot_kind='public_page'")" = "1"
          test "$(psql -qAt -c "select length(content_hash) from internal.order_snapshots where order_id='88888888-8888-4888-8888-888888888880' and snapshot_kind='public_page'")" = "64"
          test "$(psql -qAt -c "select count(*) from public.order_events where order_id='88888888-8888-4888-8888-888888888880' and state='PREVIEW_READY'")" = "1"
          test "$(psql -qAt -c "select count(*) from public.order_events where order_id='88888888-8888-4888-8888-888888888880' and state='CUSTOMER_CONFIRMED'")" = "1"

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          set request.jwt.claim.sub = '88888888-8888-4888-8888-888888888888';
          select public.prepare_presence_preview(
            '88888888-8888-4888-8888-888888888880'
          );
          SQL
          then
            echo "Authenticated client unexpectedly executed preview orchestration"
            exit 1
          else
            echo "Direct authenticated preview orchestration correctly blocked"
          fi

      - name: Verify payment RLS and server-only writes
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          insert into public.orders (id, user_id)
          values (
            '44444444-4444-4444-8444-444444444444',
            '33333333-3333-4333-8333-333333333333'
          );

          insert into public.payment_attempts (
            id, order_id, idempotency_key, status, amount_cents
          ) values
            (
              '55555555-5555-4555-8555-555555555555',
              '22222222-2222-4222-8222-222222222222',
              'ci-payment-owner',
              'CREATED',
              10000
            ),
            (
              '66666666-6666-4666-8666-666666666666',
              '44444444-4444-4444-8444-444444444444',
              'ci-payment-other',
              'CREATED',
              10000
            );
          SQL

          result="$(
            psql -qAt <<'SQL'
          set role authenticated;
          set request.jwt.claim.sub = '11111111-1111-4111-8111-111111111111';
          select count(*) from public.payment_attempts;
          reset role;
          SQL
          )"

          test "$result" = "1" || {
            echo "Payment RLS failed: expected 1 row, got $result"
            exit 1
          }

          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          set request.jwt.claim.sub = '11111111-1111-4111-8111-111111111111';
          insert into public.payment_attempts (
            order_id, idempotency_key, status, amount_cents
          ) values (
            '22222222-2222-4222-8222-222222222222',
            'forbidden-client-write',
            'APPROVED',
            10000
          );
          SQL
          then
            echo "Authenticated client unexpectedly wrote payment state"
            exit 1
          else
            echo "Client payment write correctly blocked"
          fi
