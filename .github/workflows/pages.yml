name: Validate and Deploy MotoristaOps Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Validate data snapshot
        run: npm run validate:data

      - name: Static analysis
        run: npm run check

      - name: Security gate
        run: npm run security

      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: https://henrico-design-amaral.github.io/motoristaops
          BASE_PATH: /motoristaops

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/motorista/index.html
          test -f dist/transito/index.html
          test -f dist/previsao/index.html
          test -f dist/inteligencia/index.html
          test -f dist/contexto/index.html
          test -f dist/fechamento/index.html
          test -f dist/importar-uber/index.html
          test -f dist/copiloto/index.html
          test -f dist/fontes-contexto/index.html
          grep -q "MotoristaOps" dist/index.html
          grep -q "Plano operacional" dist/index.html
          grep -q "Levando pessoas, cuidando de histórias" dist/motorista/index.html
          grep -q "Fechamento do dia" dist/fechamento/index.html
          grep -q "Copiloto operacional" dist/copiloto/index.html
          grep -q '/motoristaops/_astro/' dist/index.html
          grep -q '/motoristaops/_astro/' dist/motorista/index.html

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4