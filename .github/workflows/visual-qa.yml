name: Visual QA MotoristaOps

on:
  pull_request:
    paths:
      - 'src/pages/**'
      - 'src/styles/**'
      - 'src/layouts/**'
      - 'src/data/driver-profile.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: https://henrico-design-amaral.github.io
          BASE_PATH: /motoristaops

      - name: Prepare local Pages path
        run: |
          mkdir -p .visual-preview/motoristaops
          cp -R dist/. .visual-preview/motoristaops/

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          cd .visual-preview
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/motoristaops-visual-server.log 2>&1 &
          echo $! > /tmp/motoristaops-visual-server.pid
          sleep 2

      - name: Capture desktop and mobile views
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const base = 'http://127.0.0.1:4173/motoristaops';
            const shots = [
              { name: 'landing-desktop', url: `${base}/motorista/`, viewport: { width: 1440, height: 1000 }, fullPage: true },
              { name: 'landing-mobile', url: `${base}/motorista/`, viewport: { width: 390, height: 844 }, fullPage: true },
              { name: 'dashboard-desktop', url: `${base}/`, viewport: { width: 1440, height: 1000 }, fullPage: true },
              { name: 'dashboard-mobile', url: `${base}/`, viewport: { width: 390, height: 844 }, fullPage: true }
            ];
            const browser = await chromium.launch({ headless: true });
            for (const shot of shots) {
              const page = await browser.newPage({ viewport: shot.viewport, deviceScaleFactor: 1 });
              await page.goto(shot.url, { waitUntil: 'networkidle' });
              await page.screenshot({ path: `visual-qa/${shot.name}.png`, fullPage: shot.fullPage });
              if (shot.name === 'landing-desktop') {
                await page.evaluate(() => window.scrollTo(0, document.documentElement.scrollHeight * 0.55));
                await page.waitForTimeout(350);
                await page.screenshot({ path: 'visual-qa/landing-midscroll-progress.png', fullPage: false });
              }
              await page.close();
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: motoristaops-visual-qa
          path: visual-qa/*.png
          retention-days: 14
