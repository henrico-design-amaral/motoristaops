name: Sync package lock

on:
  push:
    branches: [fix/sync-nanoid-lock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sync-nanoid-lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lock when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: sync package lock"
          git push
