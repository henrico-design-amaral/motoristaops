name: Reset and deploy MotoristaOPS clean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: motoristaops-clean-production
  cancel-in-progress: false

jobs:
  deploy-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Assemble approved landing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-public
          cat source/parts/*.htmlfrag > deploy-public/index.html
          grep -qF 'Seu compromisso começa' deploy-public/index.html
          grep -qF 'Motorista particular' deploy-public/index.html
          cat > deploy-public/.htaccess <<'HTACCESS'
          RewriteEngine On
          RewriteCond %{HTTP_HOST} ^motoristaops\.com\.br$ [NC]
          RewriteRule ^ https://www.motoristaops.com.br%{REQUEST_URI} [R=301,L]
          HTACCESS

      - name: Validate Hostinger secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
          HOSTINGER_DASHBOARD_TARGET_DIR: ${{ secrets.HOSTINGER_DASHBOARD_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_PUBLIC_TARGET_DIR HOSTINGER_DASHBOARD_TARGET_DIR; do
            test -n "${!name:-}" || { echo "Missing secret: $name"; exit 1; }
          done

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Preserve only runtime dependencies referenced by approved landing
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preserved/landing-v3 preserved/assets/icons-official preserved/assets
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          cd "$HOSTINGER_PUBLIC_TARGET_DIR"
          lcd preserved
          get landing-v3/hero-motoristaops-v4.webp -o landing-v3/hero-motoristaops-v4.webp
          get landing-v3/logo-header-v3.svg -o landing-v3/logo-header-v3.svg
          get landing-v3/logo-oficial.svg -o landing-v3/logo-oficial.svg
          mirror --verbose assets/icons-official assets/icons-official
          get assets/henrico-profile.png -o assets/henrico-profile.png
          bye
          LFTP
          cp -a preserved/landing-v3 deploy-public/
          mkdir -p deploy-public/assets
          cp -a preserved/assets/icons-official deploy-public/assets/
          cp preserved/assets/henrico-profile.png deploy-public/assets/henrico-profile.png

      - name: Hard reset public Hostinger and deploy clean landing
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PUBLIC_TARGET_DIR: ${{ secrets.HOSTINGER_PUBLIC_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --delete-first --verbose deploy-public "$HOSTINGER_PUBLIC_TARGET_DIR"
          bye
          LFTP

      - name: Hard reset dashboard Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_DASHBOARD_TARGET_DIR: ${{ secrets.HOSTINGER_DASHBOARD_TARGET_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p empty-dashboard
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" "sftp://$HOSTINGER_HOST" <<LFTP
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --delete-first --verbose empty-dashboard "$HOSTINGER_DASHBOARD_TARGET_DIR"
          bye
          LFTP

      - name: Production verification
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            public_home="$(curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 https://www.motoristaops.com.br/ || true)"
            if grep -qF 'Seu compromisso começa' <<<"$public_home" && grep -qF 'Motorista particular' <<<"$public_home"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Public landing did not converge to approved clean version.'
              exit 1
            fi
            sleep 10
          done
          dashboard_home="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 https://dashboard.motoristaops.com.br/ || true)"
          if grep -qF 'Plano operacional' <<<"$dashboard_home" || grep -qF 'Fechamento do dia' <<<"$dashboard_home"; then
            echo 'Legacy dashboard content still exists after reset.'
            exit 1
          fi
          apex_final_url="$(curl --silent --location --output /dev/null --write-out '%{url_effective}' --connect-timeout 10 --max-time 30 https://motoristaops.com.br/)"
          test "$apex_final_url" = 'https://www.motoristaops.com.br/'
